<svg width="44" height="44" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="fractureGrad" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#ffd9ec"/>
      <stop offset="45%" stop-color="#e6c9ff"/>
      <stop offset="100%" stop-color="#5fb3ff"/>
    </linearGradient>
    <filter id="fractureGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- soft ambient glow behind the mark -->
  <circle cx="50" cy="50" r="30" fill="url(#fractureGrad)" opacity="0.25" filter="url(#fractureGlow)"/>

  <g stroke="rgba(255,255,255,0.55)" stroke-width="0.6" stroke-linejoin="round">
    <!-- upper facets (apex to equator) -->
    <polygon points="50,8 84,50 67,64" fill="url(#fractureGrad)" fill-opacity="0.95"/>
    <polygon points="50,8 67,64 33,64" fill="url(#fractureGrad)" fill-opacity="0.75"/>
    <polygon points="50,8 33,64 16,50" fill="url(#fractureGrad)" fill-opacity="0.6"/>
    <polygon points="50,8 16,50 33,36" fill="url(#fractureGrad)" fill-opacity="0.8"/>
    <polygon points="50,8 33,36 67,36" fill="url(#fractureGrad)" fill-opacity="1"/>
    <polygon points="50,8 67,36 84,50" fill="url(#fractureGrad)" fill-opacity="0.88"/>

    <!-- lower facets (equator to base apex) -->
    <polygon points="50,92 84,50 67,64" fill="url(#fractureGrad)" fill-opacity="0.7"/>
    <polygon points="50,92 67,64 33,64" fill="url(#fractureGrad)" fill-opacity="0.55"/>
    <polygon points="50,92 33,64 16,50" fill="url(#fractureGrad)" fill-opacity="0.4"/>
    <polygon points="50,92 16,50 33,36" fill="url(#fractureGrad)" fill-opacity="0.65"/>
    <polygon points="50,92 33,36 67,36" fill="url(#fractureGrad)" fill-opacity="0.9"/>
    <polygon points="50,92 67,36 84,50" fill="url(#fractureGrad)" fill-opacity="0.78"/>
  </g>
</svg>
